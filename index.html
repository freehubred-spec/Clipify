<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Clipify - Video Editor</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&family=Oswald:wght@500;600&family=Roboto:wght@500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="btnBack" title="New Project">✕</button>
      <button class="icon-btn" id="btnUndo" title="Undo">↺</button>
      <div class="topbar-title">Clipify</div>
      <button class="export-btn" id="btnExport">Export</button>
    </header>

    <section class="preview-section">
      <div class="preview-box" id="previewWrapper">
        <div class="video-container" id="videoContainer">
          <video id="previewVideo" playsinline></video>
          <div id="textOverlays"></div>
          <!-- Live text preview (before adding) -->
          <div id="liveTextPreview" class="text-overlay live-preview" style="display:none;"></div>
        </div>
        <div class="preview-empty" id="placeholder">
          <div class="empty-icon">🎬</div>
          <p>Tap + to add video</p>
        </div>
      </div>
    </section>

    <div class="playback-bar">
      <button class="play-btn" id="btnPlay">▶</button>
      <div class="time-text">
        <span id="currentTime">00:00</span><span class="sep">/</span><span id="totalTime">00:00</span>
      </div>
      <input type="range" id="seekBar" min="0" max="100" value="0" class="seek">
      <select id="speedSelect" class="speed-select">
        <option value="0.3">0.3x</option>
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
      </select>
    </div>

    <div class="timeline-section">
      <div class="timeline-header">
        <button class="mini-btn" id="btnSplit">Split</button>
        <button class="mini-btn" id="btnDelete">Delete</button>
        <span class="timeline-title">Timeline</span>
      </div>
      <div class="timeline-track" id="timeline">
        <div class="playhead" id="playhead"></div>
        <div class="clips-row" id="clipsContainer"></div>
      </div>
    </div>

    <nav class="bottom-tools">
      <button class="tool active" data-tool="media"><span class="tool-icon">📁</span><span class="tool-label">Media</span></button>
      <button class="tool" data-tool="text"><span class="tool-icon">T</span><span class="tool-label">Text</span></button>
      <button class="tool" data-tool="filters"><span class="tool-icon">✨</span><span class="tool-label">Filters</span></button>
      <button class="tool" data-tool="audio"><span class="tool-icon">🎵</span><span class="tool-label">Audio</span></button>
      <button class="tool" data-tool="ratio"><span class="tool-icon">⬜</span><span class="tool-label">Ratio</span></button>
    </nav>

    <!-- MEDIA -->
    <div class="tool-panel hidden" id="panel-media">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <label class="upload-area" for="videoInput"><div class="plus">+</div><div>Add Video</div></label>
        <input type="file" id="videoInput" accept="video/*" multiple hidden />
        <div class="media-grid" id="mediaList"></div>
      </div>
    </div>

    <!-- TEXT -->
    <div class="tool-panel hidden" id="panel-text">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <input type="text" id="textInput" placeholder="Type text here..." class="text-input" />
        
        <div class="section-label">Font</div>
        <div class="chip-row" id="fontStyleRow">
          <button class="chip active" data-font="Inter">Basic</button>
          <button class="chip" data-font="Poppins">Modern</button>
          <button class="chip" data-font="Oswald">Bold</button>
          <button class="chip" data-font="Roboto">Clean</button>
          <button class="chip" data-font="Playfair Display">Elegant</button>
        </div>

        <div class="section-label">Style</div>
        <div class="chip-row" id="textStyleRow">
          <button class="chip active" data-style="normal">Normal</button>
          <button class="chip" data-style="shadow">Shadow</button>
          <button class="chip" data-style="outline">Outline</button>
          <button class="chip" data-style="background">Box</button>
          <button class="chip" data-style="neon">Neon</button>
          <button class="chip" data-style="double">Double</button>
        </div>

        <div class="control-row"><label>Size</label><input type="range" id="fontSize" min="10" max="100" value="36" /></div>
        <div class="control-row"><label>Color</label><input type="color" id="textColor" value="#ffffff" /></div>
        <button class="action-btn" id="btnAddText">Add Text</button>
        <p class="hint">• Drag to move<br>• Pinch to resize<br>• Double tap to delete<br>• Tap to select</p>
        <div id="textEditBar" class="text-edit-bar hidden">
          <button class="mini-btn" id="btnEditText">Edit</button>
          <button class="mini-btn" id="btnDeleteText">Delete</button>
        </div>
      </div>
    </div>

    <!-- FILTERS -->
    <div class="tool-panel hidden" id="panel-filters">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <div class="filter-grid" id="filterGrid">
          <button class="filter-chip active" data-filter="none">Original</button>
          <button class="filter-chip" data-filter="grayscale">B&W</button>
          <button class="filter-chip" data-filter="sepia">Sepia</button>
          <button class="filter-chip" data-filter="vintage">Vintage</button>
          <button class="filter-chip" data-filter="cool">Cool</button>
          <button class="filter-chip" data-filter="warm">Warm</button>
          <button class="filter-chip" data-filter="contrast">Contrast</button>
          <button class="filter-chip" data-filter="fade">Fade</button>
          <button class="filter-chip" data-filter="vivid">Vivid</button>
          <button class="filter-chip" data-filter="mono">Mono</button>
          <button class="filter-chip" data-filter="cinema">Cinema</button>
          <button class="filter-chip" data-filter="bright">Bright</button>
          <button class="filter-chip" data-filter="dramatic">Dramatic</button>
          <button class="filter-chip" data-filter="soft">Soft</button>
          <button class="filter-chip" data-filter="noir">Noir</button>
          <button class="filter-chip" data-filter="sunset">Sunset</button>
        </div>
        <div class="control-row"><label>Brightness</label><input type="range" id="brightness" min="40" max="160" value="100" /></div>
        <div class="control-row"><label>Contrast</label><input type="range" id="contrast" min="40" max="160" value="100" /></div>
        <div class="control-row"><label>Saturate</label><input type="range" id="saturate" min="0" max="220" value="100" /></div>
      </div>
    </div>

    <!-- AUDIO -->
    <div class="tool-panel hidden" id="panel-audio">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <div class="section-label">Built-in Effects</div>
        <div class="sfx-row">
          <button class="sfx-btn" data-sfx="click">Click</button>
          <button class="sfx-btn" data-sfx="whoosh">Whoosh</button>
          <button class="sfx-btn" data-sfx="pop">Pop</button>
          <button class="sfx-btn" data-sfx="beep">Beep</button>
          <button class="sfx-btn" data-sfx="notify">Notify</button>
          <button class="sfx-btn" data-sfx="bird">Bird</button>
          <button class="sfx-btn" data-sfx="dog">Dog</button>
          <button class="sfx-btn" data-sfx="cat">Cat</button>
        </div>
        <div class="section-label">Upload Music</div>
        <label class="upload-area small" for="audioInput"><div>Add Music File</div></label>
        <input type="file" id="audioInput" accept="audio/*" hidden />
        <div class="control-row"><label>Volume</label><input type="range" id="volume" min="0" max="100" value="80" /></div>
        <div id="audioInfo" class="audio-name"></div>
      </div>
    </div>

    <!-- RATIO -->
    <div class="tool-panel hidden" id="panel-ratio">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <div class="section-label">Aspect Ratio</div>
        <div class="ratio-grid">
          <button class="ratio-chip active" data-ratio="16:9"><div class="ratio-preview r169"></div><span>16:9</span></button>
          <button class="ratio-chip" data-ratio="9:16"><div class="ratio-preview r916"></div><span>9:16</span></button>
          <button class="ratio-chip" data-ratio="1:1"><div class="ratio-preview r11"></div><span>1:1</span></button>
          <button class="ratio-chip" data-ratio="4:5"><div class="ratio-preview r45"></div><span>4:5</span></button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="exportModal">
    <div class="modal-box">
      <h3>Export Video</h3>
      <p id="exportStatus">Preparing edited video...</p>
      <div class="progress-wrap hidden" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <button class="action-btn" id="btnStartExport">Start Export</button>
      <button class="cancel-btn" id="btnCancelExport">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
