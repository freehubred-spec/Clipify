<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Clipify - Video Editor</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">

    <!-- Top Bar -->
    <header class="topbar">
      <button class="icon-btn" id="btnBack" title="New Project">✕</button>
      <div class="topbar-title">Clipify</div>
      <button class="export-btn" id="btnExport">Export</button>
    </header>

    <!-- Preview -->
    <section class="preview-section">
      <div class="preview-box" id="previewWrapper">
        <video id="previewVideo" playsinline></video>
        <div id="textOverlays"></div>
        <div class="preview-empty" id="placeholder">
          <div class="empty-icon">🎬</div>
          <p>Tap + to add video</p>
        </div>
      </div>
    </section>

    <!-- Playback Controls -->
    <div class="playback-bar">
      <button class="play-btn" id="btnPlay">▶</button>
      <div class="time-text">
        <span id="currentTime">00:00</span>
        <span class="sep">/</span>
        <span id="totalTime">00:00</span>
      </div>
      <input type="range" id="seekBar" min="0" max="100" value="0" class="seek">
      <select id="speedSelect" class="speed-select">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>

    <!-- Timeline -->
    <div class="timeline-section">
      <div class="timeline-header">
        <button class="mini-btn" id="btnSplit">Split</button>
        <button class="mini-btn" id="btnDelete">Delete</button>
        <span class="timeline-title">Timeline</span>
      </div>
      <div class="timeline-track" id="timeline">
        <div class="playhead" id="playhead"></div>
        <div class="clips-row" id="clipsContainer"></div>
      </div>
    </div>

    <!-- Bottom Tools (InShot style) -->
    <nav class="bottom-tools">
      <button class="tool active" data-tool="media">
        <span class="tool-icon">📁</span>
        <span class="tool-label">Media</span>
      </button>
      <button class="tool" data-tool="text">
        <span class="tool-icon">T</span>
        <span class="tool-label">Text</span>
      </button>
      <button class="tool" data-tool="filters">
        <span class="tool-icon">✨</span>
        <span class="tool-label">Filters</span>
      </button>
      <button class="tool" data-tool="audio">
        <span class="tool-icon">🎵</span>
        <span class="tool-label">Audio</span>
      </button>
      <button class="tool" data-tool="ratio">
        <span class="tool-icon">⬜</span>
        <span class="tool-label">Ratio</span>
      </button>
    </nav>

    <!-- Tool Panels (slide up) -->
    <div class="tool-panel hidden" id="panel-media">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <label class="upload-area" for="videoInput">
          <div class="plus">+</div>
          <div>Add Video</div>
        </label>
        <input type="file" id="videoInput" accept="video/*" multiple hidden />
        <div class="media-grid" id="mediaList"></div>
      </div>
    </div>

    <div class="tool-panel hidden" id="panel-text">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <input type="text" id="textInput" placeholder="Type your text..." class="text-input" />
        <div class="control-row">
          <label>Size</label>
          <input type="range" id="fontSize" min="20" max="100" value="42" />
        </div>
        <div class="control-row">
          <label>Color</label>
          <input type="color" id="textColor" value="#ffffff" />
        </div>
        <button class="action-btn" id="btnAddText">Add Text</button>
      </div>
    </div>

    <div class="tool-panel hidden" id="panel-filters">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <div class="filter-row">
          <button class="filter-chip active" data-filter="none">Original</button>
          <button class="filter-chip" data-filter="grayscale">B&W</button>
          <button class="filter-chip" data-filter="sepia">Sepia</button>
          <button class="filter-chip" data-filter="contrast">Contrast</button>
          <button class="filter-chip" data-filter="brightness">Bright</button>
          <button class="filter-chip" data-filter="saturate">Vibrant</button>
        </div>
        <div class="control-row">
          <label>Brightness</label>
          <input type="range" id="brightness" min="50" max="150" value="100" />
        </div>
        <div class="control-row">
          <label>Contrast</label>
          <input type="range" id="contrast" min="50" max="150" value="100" />
        </div>
        <div class="control-row">
          <label>Saturate</label>
          <input type="range" id="saturate" min="0" max="200" value="100" />
        </div>
      </div>
    </div>

    <div class="tool-panel hidden" id="panel-audio">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <label class="upload-area small" for="audioInput">
          <div>Add Music</div>
        </label>
        <input type="file" id="audioInput" accept="audio/*" hidden />
        <div class="control-row">
          <label>Volume</label>
          <input type="range" id="volume" min="0" max="100" value="80" />
        </div>
        <div id="audioInfo" class="audio-name"></div>
      </div>
    </div>

    <div class="tool-panel hidden" id="panel-ratio">
      <div class="panel-handle"></div>
      <div class="panel-content">
        <div class="ratio-row">
          <button class="ratio-chip active" data-ratio="16:9">16:9</button>
          <button class="ratio-chip" data-ratio="9:16">9:16</button>
          <button class="ratio-chip" data-ratio="1:1">1:1</button>
          <button class="ratio-chip" data-ratio="4:5">4:5</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Export Modal -->
  <div class="modal hidden" id="exportModal">
    <div class="modal-box">
      <h3>Export Video</h3>
      <p>Download your edited video</p>
      <button class="action-btn" id="btnStartExport">Download</button>
      <button class="cancel-btn" id="btnCancelExport">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
